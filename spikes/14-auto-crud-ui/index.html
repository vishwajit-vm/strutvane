<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strutvane admin (spike 14)</title>
    <script>
      // Apply the saved theme before the first paint, so dark mode never flashes white.
      // Same key and rules as src/app/theme/theme.tsx; storage can throw, so it is guarded.
      try {
        var saved = localStorage.getItem('strutvane.theme')
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
